name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The latest GitHub Release is the source of truth: Probitas 2+ attaches
      # its binaries and SHA256SUMS there.
      - name: Fetch latest version
        id: version
        run: |
          url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/probitas-test/probitas/releases/latest)
          VERSION="${url##*/tag/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest version: $VERSION"

      # Probitas 1.x is installed through its install.sh with Deno; only the
      # version needs updating.
      - name: Update Formula version (1.x)
        if: startsWith(steps.version.outputs.version, '0.') || startsWith(steps.version.outputs.version, '1.')
        run: |
          perl -pi -e 's/version "[^"]*"/version "${{ steps.version.outputs.version }}"/' Formula/probitas.rb

      - name: Render binary Formula (2.x and later)
        if: ${{ !startsWith(steps.version.outputs.version, '0.') && !startsWith(steps.version.outputs.version, '1.') }}
        run: |
          curl -fsSL "https://github.com/probitas-test/probitas/releases/download/v${{ steps.version.outputs.version }}/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          sh scripts/render-formula.sh "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/SHA256SUMS" > Formula/probitas.rb

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet Formula/probitas.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected"
            git diff Formula/probitas.rb
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/probitas.rb
          git commit -m "Update probitas formula to ${{ steps.version.outputs.version }}"
          git push
